Identifier: eos7s53
Slug: mtbaim
Status: In progress
Title: MtbAIM Antitubercular Activity
Description: 'Predicts activity against Mycobacterium tuberculosis H37Rv, modelling
  drug-susceptible and drug-resistant isolates separately: probability of activity
  (ChEMBL MIC below 5 uM labelled active, above 15 uM inactive) plus pMIC for MIC,
  MIC90 and MIC99, each with Tanimoto similarity to its training set. Eight tree-based
  models use RDKit descriptors and Morgan fingerprints, trained on ChEMBL 37 data
  (25,645 susceptible and 3,749 resistant compounds); scaffold-held-out AUROC is 0.86
  and 0.84. Validation is retrospective only.'
